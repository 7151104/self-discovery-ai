# Конвейер на каждый коммит (E10-02).
#
# Ни одной команды, которой нет в package.json: шаги вызывают те же скрипты,
# которыми проверяются локально. Логика проверок живёт в репозитории, а не в
# этом файле, поэтому «у меня проходило, а в конвейере упало» невозможно —
# `npm run verify` прогоняет всё то же самое одной командой.
#
# Версия Node берётся из .nvmrc: одно место на конвейер, локальную машину и
# площадку. Ниже 22.5 не опускаться — база живёт на встроенном node:sqlite.
#
# Чтобы падение конвейера действительно останавливало ветку, в настройках
# репозитория эта проверка должна быть обязательной для слияния: Settings →
# Branches → Branch protection rules → Require status checks to pass. Файлом
# это не включается — только владельцем репозитория (открытый вопрос 31).

name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

# Новый коммит в ту же ветку отменяет предыдущий прогон: смысла проверять
# промежуточное состояние нет.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Сборка, тесты, линтеры
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Ровно то, что в package-lock.json: конвейер не разрешает себе других
      # версий зависимостей, чем локальная машина.
      - name: Зависимости
        run: npm ci

      - name: Сборка
        run: npm run build

      # Тесты движка, контента, сервера и клиента; сюда же входят сканер
      # секретов, проверка схемы, копий базы и механики выпуска.
      - name: Тесты
        run: npm test

      - name: Линтер контента
        run: npm run lint:content

      - name: Линтер стилей
        run: npm run lint:styles

      # Бюджеты первой загрузки из docs/12-target-state.md (E6-01, E10-09):
      # вес скриптов и стилей, число модулей, отсутствие веб-шрифта.
      # Превышение ломает сборку, а не пишет предупреждение.
      - name: Бюджеты производительности
        run: npm run lint:budget

      # Миграция без отката, с пропуском в номерах, с занятым номером или
      # изменённая после применения останавливает конвейер (E10-04).
      - name: Совместимость миграций
        run: npm run migrate:check
